name: Print Environment Variable

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  print-env:
    runs-on: ubuntu-latest
    steps:
      - name: Print Secret
        run: echo "Secret var is ${{ secrets.MY_SECRET_VAR }}"

      - name: Print Plain Variable
        run: echo "Plain var is $MY_PLAIN_VAR"
        env:
          MY_PLAIN_VAR: ${{ vars.MY_PLAIN_VAR }}

      - name: Check if NEXT_PUBLIC_SUPABASE_URL exist
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL is empty!"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_URL is set."
          fi

      - name: Check if NEXT_PUBLIC_SUPABASE_ANON_KEY exist
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is empty!"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is set."
          fi

      - name: Check env vars
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Print .env file
        run: |
          cat .env


      - name: Debug NEXT_PUBLIC_SUPABASE_URL
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL length: ${{ vars.NEXT_PUBLIC_SUPABASE_URL && vars.NEXT_PUBLIC_SUPABASE_URL.length || 0 }}"

      - name: Debug NEXT_PUBLIC_SUPABASE_ANON_KEY
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY length: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY.length || 0 }}"
